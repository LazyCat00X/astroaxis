<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroAxis 2.5D - Pure Canvas 2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #globe-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #globe-canvas:active { cursor: grabbing; }
    .marker {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88, 0 0 24px #00ff88;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
    }
    .marker-label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      background: rgba(0,0,0,0.8);
      padding: 2px 6px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .marker:hover .marker-label { opacity: 1; }
    #stats {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="globe-canvas"></canvas>
  <div id="stats">
    <div>AstroAxis 2.5D (Pure Canvas 2D)</div>
    <div>Markers: <span id="marker-count">0</span></div>
    <div>Rotation: <span id="rotation">0, 0</span></div>
  </div>

  <script>
    const canvas = document.getElementById('globe-canvas');
    const ctx = canvas.getContext('2d');
    const stats = document.getElementById('stats');
    
    // Resize canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    
    // Globe state
    const globe = {
      rotationX: 0.3,
      rotationY: 0,
      radius: 300,
      centerX: 0,
      centerY: 0
    };
    
    // Sample markers
    const markers = [
      { lat: 40.7128, lon: -74.0060, label: 'New York', topic: 'Finance', count: 15 },
      { lat: 51.5074, lon: -0.1278, label: 'London', topic: 'Politics', count: 12 },
      { lat: 35.6762, lon: 139.6503, label: 'Tokyo', topic: 'Tech', count: 18 },
      { lat: 37.7749, lon: -122.4194, label: 'San Francisco', topic: 'Tech', count: 22 },
      { lat: 48.8566, lon: 2.3522, label: 'Paris', topic: 'Climate', count: 8 },
      { lat: -33.8688, lon: 151.2093, label: 'Sydney', topic: 'Finance', count: 10 },
      { lat: 55.7558, lon: 37.6173, label: 'Moscow', topic: 'Politics', count: 14 },
      { lat: 22.3193, lon: 114.1694, label: 'Hong Kong', topic: 'Finance', count: 16 },
      { lat: 1.3521, lon: 103.8198, label: 'Singapore', topic: 'Finance', count: 11 },
      { lat: 39.9042, lon: 116.4074, label: 'Beijing', topic: 'Politics', count: 20 },
      { lat: 31.2304, lon: 121.4737, label: 'Shanghai', topic: 'Finance', count: 17 },
      { lat: 37.5665, lon: 126.9780, label: 'Seoul', topic: 'Tech', count: 14 },
      { lat: 28.6139, lon: 77.2090, label: 'New Delhi', topic: 'Tech', count: 13 },
      { lat: 19.4326, lon: -99.1332, label: 'Mexico City', topic: 'Politics', count: 7 },
      { lat: -23.5505, lon: -46.6333, label: 'São Paulo', topic: 'Finance', count: 9 }
    ];
    
    const topicColors = {
      'Finance': '#00ff88',
      'Politics': '#ff6b6b',
      'Tech': '#4ecdc4',
      'Climate': '#ffe66d'
    };
    
    // 3D to 2D projection
    function project3D(x, y, z) {
      const cosY = Math.cos(globe.rotationY);
      const sinY = Math.sin(globe.rotationY);
      const cosX = Math.cos(globe.rotationX);
      const sinX = Math.sin(globe.rotationX);
      
      // Rotate Y
      let x2 = x * cosY + z * sinY;
      let z2 = -x * sinY + z * cosY;
      
      // Rotate X
      let y2 = y * cosX - z2 * sinX;
      let z3 = y * sinX + z2 * cosX;
      
      // Simple perspective
      const scale = 1000 / (1000 + z3);
      
      return {
        x: globe.centerX + x2 * scale,
        y: globe.centerY - y2 * scale,
        z: z3,
        scale: scale
      };
    }
    
    // Lat/Lon to 3D
    function latLonTo3D(lat, lon, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      
      return {
        x: -radius * Math.sin(phi) * Math.cos(theta),
        y: radius * Math.cos(phi),
        z: radius * Math.sin(phi) * Math.sin(theta)
      };
    }
    
    // Draw grid
    function drawGrid() {
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.15)';
      ctx.lineWidth = 1;
      
      // Latitude lines
      for (let lat = -80; lat <= 80; lat += 20) {
        ctx.beginPath();
        let started = false;
        for (let lon = -180; lon <= 180; lon += 5) {
          const p3d = latLonTo3D(lat, lon, globe.radius);
          const p2d = project3D(p3d.x, p3d.y, p3d.z);
          if (p2d.z < 0) {
            if (!started) {
              ctx.moveTo(p2d.x, p2d.y);
              started = true;
            } else {
              ctx.lineTo(p2d.x, p2d.y);
            }
          }
        }
        ctx.stroke();
      }
      
      // Longitude lines
      for (let lon = -180; lon < 180; lon += 30) {
        ctx.beginPath();
        let started = false;
        for (let lat = -90; lat <= 90; lat += 5) {
          const p3d = latLonTo3D(lat, lon, globe.radius);
          const p2d = project3D(p3d.x, p3d.y, p3d.z);
          if (p2d.z < 0) {
            if (!started) {
              ctx.moveTo(p2d.x, p2d.y);
              started = true;
            } else {
              ctx.lineTo(p2d.x, p2d.y);
            }
          }
        }
        ctx.stroke();
      }
    }
    
    // Draw globe
    function drawGlobe() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      globe.centerX = canvas.width / 2;
      globe.centerY = canvas.height / 2;
      
      // Globe sphere
      const gradient = ctx.createRadialGradient(
        globe.centerX - globe.radius * 0.3,
        globe.centerY - globe.radius * 0.3,
        0,
        globe.centerX,
        globe.centerY,
        globe.radius
      );
      gradient.addColorStop(0, 'rgba(30, 50, 80, 1)');
      gradient.addColorStop(0.7, 'rgba(15, 30, 60, 1)');
      gradient.addColorStop(1, 'rgba(5, 15, 30, 1)');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(globe.centerX, globe.centerY, globe.radius, 0, Math.PI * 2);
      ctx.fill();
      
      // Grid
      drawGrid();
      
      // Edge glow
      const edgeGradient = ctx.createRadialGradient(
        globe.centerX, globe.centerY,
        globe.radius * 0.95,
        globe.centerX, globe.centerY,
        globe.radius * 1.1
      );
      edgeGradient.addColorStop(0, 'rgba(100, 200, 255, 0)');
      edgeGradient.addColorStop(1, 'rgba(100, 200, 255, 0.3)');
      
      ctx.strokeStyle = edgeGradient;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(globe.centerX, globe.centerY, globe.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // Update markers
    function updateMarkers() {
      let visibleCount = 0;
      
      markers.forEach((marker, i) => {
        const p3d = latLonTo3D(marker.lat, marker.lon, globe.radius * 1.02);
        const p2d = project3D(p3d.x, p3d.y, p3d.z);
        
        let el = document.getElementById(`marker-${i}`);
        
        if (p2d.z < 0) {
          visibleCount++;
          
          if (!el) {
            el = document.createElement('div');
            el.id = `marker-${i}`;
            el.className = 'marker';
            el.style.background = topicColors[marker.topic] || '#00ff88';
            el.style.boxShadow = `0 0 12px ${topicColors[marker.topic] || '#00ff88'}, 0 0 24px ${topicColors[marker.topic] || '#00ff88'}`;
            
            const label = document.createElement('div');
            label.className = 'marker-label';
            label.textContent = `${marker.label} (${marker.count})`;
            el.appendChild(label);
            
            el.addEventListener('click', () => {
              alert(`${marker.label}\n${marker.topic}\n${marker.count} articles`);
            });
            
            document.body.appendChild(el);
          }
          
          el.style.left = p2d.x + 'px';
          el.style.top = p2d.y + 'px';
          el.style.display = 'block';
          el.style.transform = `translate(-50%, -50%) scale(${p2d.scale})`;
        } else {
          if (el) el.style.display = 'none';
        }
      });
      
      document.getElementById('marker-count').textContent = visibleCount;
    }
    
    // Mouse controls
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        
        globe.rotationY += dx * 0.005;
        globe.rotationX += dy * 0.005;
        globe.rotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, globe.rotationX));
        
        lastMouse = { x: e.clientX, y: e.clientY };
        
        document.getElementById('rotation').textContent = 
          `${globe.rotationX.toFixed(2)}, ${globe.rotationY.toFixed(2)}`;
      }
    });
    
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    
    // Animation loop
    function animate() {
      drawGlobe();
      updateMarkers();
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
