<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroAxis 2.5D Hybrid Globe v3 - Three.js + CSS3DRenderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #css3d-container {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }
    
    /* HTML Marker Styles */
    .news-marker {
      width: 200px;
      padding: 12px;
      background: rgba(10, 20, 40, 0.95);
      border: 2px solid rgba(100, 200, 255, 0.5);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    .news-marker:hover {
      background: rgba(20, 40, 80, 0.95);
      border-color: #64c8ff;
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(100, 200, 255, 0.3);
    }
    
    .marker-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        box-shadow: 0 0 10px currentColor;
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 0 20px currentColor, 0 0 30px currentColor;
        transform: scale(1.2);
      }
    }
    
    .marker-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
    
    .marker-topic {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .marker-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #b0b8d0;
    }
    
    .marker-stats {
      margin-top: 8px;
      font-size: 11px;
      color: #64c8ff;
      border-top: 1px solid rgba(100, 200, 255, 0.2);
      padding-top: 6px;
    }
    
    /* Control Panel */
    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.95);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(100, 200, 255, 0.3);
      z-index: 10;
      min-width: 280px;
      backdrop-filter: blur(10px);
    }
    
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #64c8ff;
      margin-bottom: 16px;
    }
    
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    
    .filter-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(100, 200, 255, 0.3);
      background: rgba(100, 200, 255, 0.1);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-btn:hover {
      background: rgba(100, 200, 255, 0.2);
    }
    
    .filter-btn.active {
      background: rgba(100, 200, 255, 0.3);
      border-color: #64c8ff;
    }
    
    .instructions {
      font-size: 11px;
      color: #8892b6;
      line-height: 1.6;
    }
    
    #marker-count {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(100, 200, 255, 0.3);
      z-index: 10;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>
  <div id="css3d-container"></div>
  
  <div class="control-panel">
    <div class="panel-title">🌐 AstroAxis 2.5D Hybrid</div>
    <div class="filter-buttons" id="filter-buttons">
      <button class="filter-btn active" data-topic="all">All</button>
      <button class="filter-btn" data-topic="Finance">💰 Finance</button>
      <button class="filter-btn" data-topic="Politics">🏛️ Politics</button>
      <button class="filter-btn" data-topic="Tech">💻 Tech</button>
      <button class="filter-btn" data-topic="Climate">🌍 Climate</button>
    </div>
    <div class="instructions">
      <div>✅ Three.js WebGL 渲染球體</div>
      <div>✅ CSS3DRenderer 渲染 HTML 標記</div>
      <div>🖱️ Drag to rotate</div>
      <div>🔍 Scroll to zoom</div>
      <div>👆 Click HTML markers</div>
    </div>
  </div>
  
  <div id="marker-count">Loading...</div>

  <!-- Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
    camera.position.z = 800;

    // WebGL Renderer (球體、經緯線、粒子)
    const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    webglRenderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('webgl-container').appendChild(webglRenderer.domElement);

    // CSS3D Renderer (HTML 標記)
    const css3dRenderer = new CSS3DRenderer();
    css3dRenderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('css3d-container').appendChild(css3dRenderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, css3dRenderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.5;
    controls.minDistance = 400;
    controls.maxDistance = 1500;

    // Globe parameters
    const GLOBE_RADIUS = 300;

    // Create globe (WebGL)
    const globeGeometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
    const globeMaterial = new THREE.MeshPhongMaterial({
      color: 0x1a3a5c,
      emissive: 0x0a1a2c,
      specular: 0x64c8ff,
      shininess: 10,
      transparent: true,
      opacity: 0.9
    });
    const globe = new THREE.Mesh(globeGeometry, globeMaterial);
    scene.add(globe);

    // Atmosphere glow
    const atmosphereGeometry = new THREE.SphereGeometry(GLOBE_RADIUS * 1.05, 64, 64);
    const atmosphereMaterial = new THREE.MeshBasicMaterial({
      color: 0x64c8ff,
      transparent: true,
      opacity: 0.1,
      side: THREE.BackSide
    });
    const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
    scene.add(atmosphere);

    // Grid lines (WebGL)
    const gridMaterial = new THREE.LineBasicMaterial({ 
      color: 0x64c8ff, 
      transparent: true, 
      opacity: 0.2 
    });

    // Latitude lines
    for (let lat = -80; lat <= 80; lat += 20) {
      const points = [];
      for (let lon = 0; lon <= 360; lon += 5) {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = lon * Math.PI / 180;
        const x = GLOBE_RADIUS * Math.sin(phi) * Math.cos(theta);
        const y = GLOBE_RADIUS * Math.cos(phi);
        const z = GLOBE_RADIUS * Math.sin(phi) * Math.sin(theta);
        points.push(new THREE.Vector3(x, y, z));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, gridMaterial);
      scene.add(line);
    }

    // Longitude lines
    for (let lon = 0; lon < 360; lon += 30) {
      const points = [];
      for (let lat = -90; lat <= 90; lat += 5) {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = lon * Math.PI / 180;
        const x = GLOBE_RADIUS * Math.sin(phi) * Math.cos(theta);
        const y = GLOBE_RADIUS * Math.cos(phi);
        const z = GLOBE_RADIUS * Math.sin(phi) * Math.sin(theta);
        points.push(new THREE.Vector3(x, y, z));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, gridMaterial);
      scene.add(line);
    }

    // Lights
    const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 3, 5);
    scene.add(directionalLight);

    // News markers data
    const markersData = [
      { lat: 40.7128, lon: -74.0060, label: 'New York', topic: 'Finance', desc: 'Wall Street financial district', count: 15 },
      { lat: 51.5074, lon: -0.1278, label: 'London', topic: 'Politics', desc: 'UK Parliament, Brexit negotiations', count: 12 },
      { lat: 35.6762, lon: 139.6503, label: 'Tokyo', topic: 'Tech', desc: 'AI and robotics hub', count: 18 },
      { lat: 37.7749, lon: -122.4194, label: 'San Francisco', topic: 'Tech', desc: 'Silicon Valley headquarters', count: 22 },
      { lat: 48.8566, lon: 2.3522, label: 'Paris', topic: 'Climate', desc: 'Paris Agreement headquarters', count: 8 },
      { lat: -33.8688, lon: 151.2093, label: 'Sydney', topic: 'Finance', desc: 'Asia-Pacific financial center', count: 10 },
      { lat: 55.7558, lon: 37.6173, label: 'Moscow', topic: 'Politics', desc: 'Geopolitical tensions', count: 14 },
      { lat: 22.3193, lon: 114.1694, label: 'Hong Kong', topic: 'Finance', desc: 'International financial hub', count: 16 },
      { lat: 1.3521, lon: 103.8198, label: 'Singapore', topic: 'Finance', desc: 'Southeast Asian financial center', count: 11 },
      { lat: 19.4326, lon: -99.1332, label: 'Mexico City', topic: 'Politics', desc: 'Latin American politics', count: 7 },
      { lat: -23.5505, lon: -46.6333, label: 'São Paulo', topic: 'Finance', desc: 'South America economic center', count: 9 },
      { lat: 28.6139, lon: 77.2090, label: 'New Delhi', topic: 'Tech', desc: 'IT services hub', count: 13 },
      { lat: 39.9042, lon: 116.4074, label: 'Beijing', topic: 'Politics', desc: 'Central government', count: 20 },
      { lat: 31.2304, lon: 121.4737, label: 'Shanghai', topic: 'Finance', desc: 'China financial center', count: 17 },
      { lat: 37.5665, lon: 126.9780, label: 'Seoul', topic: 'Tech', desc: 'Semiconductor industry', count: 14 }
    ];

    const topicColors = {
      'Finance': '#00ff88',
      'Politics': '#ff6b6b',
      'Tech': '#4ecdc4',
      'Climate': '#ffe66d'
    };

    // Create CSS3D markers (HTML elements)
    const css3dObjects = [];
    
    markersData.forEach((marker, idx) => {
      // Convert lat/lon to 3D position
      const phi = (90 - marker.lat) * Math.PI / 180;
      const theta = (marker.lon + 180) * Math.PI / 180;
      const x = -(GLOBE_RADIUS + 20) * Math.sin(phi) * Math.cos(theta);
      const y = (GLOBE_RADIUS + 20) * Math.cos(phi);
      const z = (GLOBE_RADIUS + 20) * Math.sin(phi) * Math.sin(theta);

      // Create HTML element
      const element = document.createElement('div');
      element.className = 'news-marker';
      element.id = `marker-${idx}`;
      element.dataset.topic = marker.topic;
      
      const color = topicColors[marker.topic];
      element.innerHTML = `
        <div class="marker-title">
          <span class="marker-dot" style="background: ${color}; color: ${color};"></span>
          ${marker.label}
        </div>
        <div class="marker-topic" style="background: ${color}20; color: ${color};">${marker.topic}</div>
        <div class="marker-desc">${marker.desc}</div>
        <div class="marker-stats">📰 ${marker.count} articles</div>
      `;

      // Click handler
      element.addEventListener('click', () => {
        console.log('Clicked:', marker.label);
        alert(`📍 ${marker.label}\n${marker.topic}\n${marker.desc}\n${marker.count} articles`);
      });

      // Create CSS3DObject
      const object = new CSS3DObject(element);
      object.position.set(x, y, z);
      
      // Rotate to face outward
      object.lookAt(0, 0, 0);
      object.rotateY(Math.PI);
      
      scene.add(object);
      css3dObjects.push({ object, data: marker });
    });

    // Filter functionality
    let activeFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.topic;
        
        // Show/hide markers
        css3dObjects.forEach(({ object, data }) => {
          const visible = activeFilter === 'all' || data.topic === activeFilter;
          object.visible = visible;
        });
      });
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      controls.update();
      
      // Render both scenes
      webglRenderer.render(scene, camera);
      css3dRenderer.render(scene, camera);
      
      // Update marker count
      const visibleCount = css3dObjects.filter(({ object }) => object.visible).length;
      document.getElementById('marker-count').textContent = 
        `Markers: ${visibleCount} visible / ${markersData.length} total`;
    }

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      
      webglRenderer.setSize(window.innerWidth, window.innerHeight);
      css3dRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start
    animate();
  </script>
</body>
</html>
