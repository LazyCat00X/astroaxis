<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroAxis Hybrid 3D+HTML Globe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #globe-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #markers-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .marker {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s;
    }
    .marker:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
    .marker-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00ff88;
      border: 2px solid #fff;
      box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
    }
    .marker-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(100, 200, 255, 0.3);
    }
    .marker-tooltip {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 40, 0.95);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(100, 200, 255, 0.5);
      font-size: 13px;
      min-width: 200px;
      display: none;
      z-index: 100;
    }
    .marker:hover .marker-tooltip {
      display: block;
    }
    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.9);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(100, 200, 255, 0.3);
      font-size: 14px;
      line-height: 1.6;
      z-index: 10;
    }
    .info h2 {
      color: #64c8ff;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .info ul {
      list-style: none;
      padding-left: 0;
    }
    .info li {
      margin: 5px 0;
    }
    .info code {
      background: rgba(100, 200, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="globe-canvas"></canvas>
  <div id="markers-container"></div>
  
  <div class="info">
    <h2>🌐 Hybrid 3D+HTML Globe</h2>
    <ul>
      <li>🎨 <strong>Canvas 3D</strong> 渲染球體</li>
      <li>📍 <strong>HTML DOM</strong> 標記點</li>
      <li>🖱 拖曳旋轉 / 滾輪縮放</li>
      <li>👆 Hover 標記顯示 tooltip</li>
      <li>✅ 易於測試（DOM 元素）</li>
    </ul>
    <div id="stats" style="margin-top: 10px; color: #64c8ff;"></div>
  </div>

  <script>
    const canvas = document.getElementById('globe-canvas');
    const ctx = canvas.getContext('2d');
    const markersContainer = document.getElementById('markers-container');
    
    // 設置 canvas 大小
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    
    // Globe 參數
    const globe = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 300,
      rotationY: 0,
      rotationX: 0.3,
      zoom: 1
    };
    
    // 新聞標記數據
    const markers = [
      { lat: 40.7128, lon: -74.0060, label: 'New York', topic: 'Finance', desc: '美國金融中心，華爾街所在地' },
      { lat: 51.5074, lon: -0.1278, label: 'London', topic: 'Politics', desc: '英國首都，全球政治中心' },
      { lat: 35.6762, lon: 139.6503, label: 'Tokyo', topic: 'Tech', desc: '日本首都，科技創新中心' },
      { lat: 37.7749, lon: -122.4194, label: 'San Francisco', topic: 'Tech', desc: '矽谷所在地，科技巨頭聚集' },
      { lat: 48.8566, lon: 2.3522, label: 'Paris', topic: 'Climate', desc: '法國首都，氣候協議簽署地' },
      { lat: -33.8688, lon: 151.2093, label: 'Sydney', topic: 'Finance', desc: '澳洲最大城市，亞太金融中心' },
      { lat: 55.7558, lon: 37.6173, label: 'Moscow', topic: 'Politics', desc: '俄羅斯首都，地緣政治焦點' },
      { lat: 22.3193, lon: 114.1694, label: 'Hong Kong', topic: 'Finance', desc: '國際金融中心，亞洲樞紐' },
      { lat: 1.3521, lon: 103.8198, label: 'Singapore', topic: 'Finance', desc: '東南亞金融中心' },
      { lat: 19.4326, lon: -99.1332, label: 'Mexico City', topic: 'Politics', desc: '墨西哥首都，拉美政治中心' },
      { lat: -23.5505, lon: -46.6333, label: 'São Paulo', topic: 'Finance', desc: '巴西最大城市，南美經濟中心' },
      { lat: 28.6139, lon: 77.2090, label: 'New Delhi', topic: 'Tech', desc: '印度首都，IT 產業中心' },
      { lat: 39.9042, lon: 116.4074, label: 'Beijing', topic: 'Politics', desc: '中國首都，政治中心' },
      { lat: 31.2304, lon: 121.4737, label: 'Shanghai', topic: 'Finance', desc: '中國最大城市，金融中心' },
      { lat: 37.5665, lon: 126.9780, label: 'Seoul', topic: 'Tech', desc: '韓國首都，科技創新中心' }
    ];
    
    const topicColors = {
      'Finance': '#00ff88',
      'Politics': '#ff6b6b',
      'Tech': '#4ecdc4',
      'Climate': '#ffe66d'
    };
    
    // 經緯度轉 3D 座標
    function latLonTo3D(lat, lon, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return {
        x: -radius * Math.sin(phi) * Math.cos(theta),
        y: radius * Math.cos(phi),
        z: radius * Math.sin(phi) * Math.sin(theta)
      };
    }
    
    // 旋轉 3D 座標
    function rotate3D(point, rotY, rotX) {
      let x = point.x * Math.cos(rotY) - point.z * Math.sin(rotY);
      let z = point.x * Math.sin(rotY) + point.z * Math.cos(rotY);
      let y = point.y;
      
      const y2 = y * Math.cos(rotX) - z * Math.sin(rotX);
      const z2 = y * Math.sin(rotX) + z * Math.cos(rotX);
      
      return { x, y: y2, z: z2 };
    }
    
    // 投影到 2D
    function project(point3D) {
      const scale = globe.zoom * globe.radius / (globe.radius + point3D.z);
      return {
        x: globe.x + point3D.x * scale,
        y: globe.y - point3D.y * scale,
        scale: scale,
        visible: point3D.z > -globe.radius * 0.3
      };
    }
    
    // 繪製球體
    function drawGlobe() {
      ctx.fillStyle = '#000010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const gradient = ctx.createRadialGradient(
        globe.x, globe.y, 0,
        globe.x, globe.y, globe.radius * globe.zoom
      );
      gradient.addColorStop(0, 'rgba(20, 30, 50, 1)');
      gradient.addColorStop(0.7, 'rgba(10, 20, 40, 1)');
      gradient.addColorStop(1, 'rgba(5, 10, 20, 1)');
      
      ctx.beginPath();
      ctx.arc(globe.x, globe.y, globe.radius * globe.zoom, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // 經緯線
      ctx.strokeStyle = 'rgba(100, 200, 255, 0.1)';
      ctx.lineWidth = 1;
      
      for (let lat = -80; lat <= 80; lat += 20) {
        ctx.beginPath();
        for (let lon = -180; lon <= 180; lon += 5) {
          const point3D = latLonTo3D(lat, lon, globe.radius);
          const rotated = rotate3D(point3D, globe.rotationY, globe.rotationX);
          const projected = project(rotated);
          
          if (projected.visible) {
            if (lon === -180) ctx.moveTo(projected.x, projected.y);
            else ctx.lineTo(projected.x, projected.y);
          }
        }
        ctx.stroke();
      }
      
      for (let lon = -180; lon < 180; lon += 30) {
        ctx.beginPath();
        for (let lat = -90; lat <= 90; lat += 5) {
          const point3D = latLonTo3D(lat, lon, globe.radius);
          const rotated = rotate3D(point3D, globe.rotationY, globe.rotationX);
          const projected = project(rotated);
          
          if (projected.visible) {
            if (lat === -90) ctx.moveTo(projected.x, projected.y);
            else ctx.lineTo(projected.x, projected.y);
          }
        }
        ctx.stroke();
      }
      
      // 邊緣光暈
      const edgeGradient = ctx.createRadialGradient(
        globe.x, globe.y, globe.radius * globe.zoom * 0.95,
        globe.x, globe.y, globe.radius * globe.zoom
      );
      edgeGradient.addColorStop(0, 'rgba(100, 200, 255, 0)');
      edgeGradient.addColorStop(1, 'rgba(100, 200, 255, 0.3)');
      
      ctx.beginPath();
      ctx.arc(globe.x, globe.y, globe.radius * globe.zoom, 0, Math.PI * 2);
      ctx.strokeStyle = edgeGradient;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    
    // 更新 HTML 標記位置
    function updateMarkers() {
      let visibleCount = 0;
      
      markers.forEach((marker, idx) => {
        const point3D = latLonTo3D(marker.lat, marker.lon, globe.radius);
        const rotated = rotate3D(point3D, globe.rotationY, globe.rotationX);
        const projected = project(rotated);
        
        let markerEl = document.getElementById(`marker-${idx}`);
        
        if (projected.visible) {
          visibleCount++;
          
          if (!markerEl) {
            // 創建 HTML 標記
            markerEl = document.createElement('div');
            markerEl.id = `marker-${idx}`;
            markerEl.className = 'marker';
            markerEl.innerHTML = `
              <div class="marker-dot" style="background: ${topicColors[marker.topic]}; box-shadow: 0 0 10px ${topicColors[marker.topic]}, 0 0 20px ${topicColors[marker.topic]};"></div>
              <div class="marker-label">${marker.label}</div>
              <div class="marker-tooltip">
                <strong>${marker.label}</strong><br>
                <span style="color: ${topicColors[marker.topic]};">${marker.topic}</span><br>
                <small>${marker.desc}</small>
              </div>
            `;
            markerEl.addEventListener('click', () => {
              alert(`Clicked: ${marker.label}\nTopic: ${marker.topic}\n${marker.desc}`);
            });
            markersContainer.appendChild(markerEl);
          }
          
          markerEl.style.left = `${projected.x}px`;
          markerEl.style.top = `${projected.y}px`;
          markerEl.style.display = 'block';
        } else {
          if (markerEl) markerEl.style.display = 'none';
        }
      });
      
      document.getElementById('stats').textContent = 
        `Markers: ${visibleCount} visible / ${markers.length} total`;
    }
    
    // 動畫循環
    function animate() {
      globe.x = canvas.width / 2;
      globe.y = canvas.height / 2;
      
      drawGlobe();
      updateMarkers();
      
      requestAnimationFrame(animate);
    }
    
    // 滑鼠拖拽旋轉
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaX = e.clientX - lastMouse.x;
        const deltaY = e.clientY - lastMouse.y;
        
        globe.rotationY += deltaX * 0.005;
        globe.rotationX += deltaY * 0.005;
        globe.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, globe.rotationX));
        
        lastMouse = { x: e.clientX, y: e.clientY };
      }
    });
    
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    
    // 滾輪縮放
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      globe.zoom -= e.deltaY * 0.001;
      globe.zoom = Math.max(0.5, Math.min(2, globe.zoom));
    });
    
    // 自動旋轉
    function autoRotate() {
      if (!isDragging) {
        globe.rotationY += 0.002;
      }
      requestAnimationFrame(autoRotate);
    }
    
    // 啟動
    animate();
    autoRotate();
  </script>
</body>
</html>
