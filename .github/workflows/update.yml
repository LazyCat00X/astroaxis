name: AstroAxis Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch timeline events
        run: python3 timeline_fetcher.py
      
      - name: Crawl news articles
        run: python3 crawler.py
      
      - name: Summarize articles
        run: |
          export MAX_ARTICLES_PER_RUN=15
          timeout 8m python3 summarizer.py || echo "Summarize timed out, using cached data"
        env:
          MODELS_API_TOKEN: ${{ secrets.MODELS_API_TOKEN }}
      
      - name: Generate data files
        run: |
          python3 generate_globe_data.py
          python3 generate_sitemap.py
      
      - name: Deploy to GitHub Pages (astroaxis-site)
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/LazyCat00X/astroaxis-site.git pages-repo
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          cp "$GITHUB_WORKSPACE/deploy/index.html" .
          cp "$GITHUB_WORKSPACE/deploy/news-data.json" .
          cp "$GITHUB_WORKSPACE/deploy/timeline-data.json" .
          cp "$GITHUB_WORKSPACE/sitemap.xml" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/deploy/og-image.png" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/deploy/robots.txt" . 2>/dev/null || echo "User-agent: *" > robots.txt
          
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "auto: pipeline update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
            echo "Deployed!"
          fi
      
      - name: Sync data back to source repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/timeline.json data/cache.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "auto: sync data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
