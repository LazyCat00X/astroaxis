name: AstroAxis Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch timeline events
        run: python3 timeline_fetcher.py
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      
      - name: Crawl news articles
        run: python3 crawler.py
      
      - name: Summarize articles
        run: MAX_ARTICLES_PER_RUN=30 python3 summarizer.py
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      
      - name: Generate data files
        run: |
          python3 generate_globe_data.py
          python3 generate_news_json.py
          python3 generate_sitemap.py
      
      - name: Deploy to GitHub Pages
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html news-data.json timeline-data.json sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "auto: hourly update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
      
      - name: Sync data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/timeline.json data/timeline_recent.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "auto: sync data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi